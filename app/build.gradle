plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.rgs.staff'
    compileSdk 34

    defaultConfig {
        applicationId 'pk.rgs.staff'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
